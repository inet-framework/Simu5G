#
# Simu5G RLC conformance suite -- LTE base (single UE <-> eNB, DL flow).
#
# One UE, one eNB (MacNodeId 1), a downlink server->UE UDP/VoIP flow. The per-test
# ini sets the RLC mode via the ip2nic.*Rlc knobs (see below) and picks the observation.
#
# Runtime RLC module names on this topology (peer id 1 = eNB, DRB 1):
#   UE  TX entity : <net>.ue[0].cellularNic.rlc-<mode>-tx-1-1
#   eNB RX entity : <net>.eNB.cellularNic.rlc-<mode>-rx-1025-1
#   universal PDU-on-wire point (all modes): <net>.{ue[0]|eNB}.cellularNic.rlcMux
#
# NOTE (finalize on first build): SingleCell.ned expects the scenario IPv4 configurator
# XML (simulations/lte/demo/demo.xml). Either add `*.configurator.config =
# xmldoc(".../demo.xml")` with a resolvable path, or replace with GlobalArp + a
# Ipv4NetworkConfigurator that auto-assigns. Left unset here on purpose.
#
# SPDX-License-Identifier: LGPL-3.0-or-later
#
include _common.ini

[General]
# Wrapper network = SingleCell + a `tester: ProtocolTester` submodule (ned/RlcTestNetworks.ned).
network = simu5g.tests.protocol.rlc.LteRlcTestNet

# IPv4 addressing (absolute path so it resolves from the opp_test work dir).
*.configurator.config = xmldoc("/home/attila/projects/Simu5G/simulations/lte/demo/demo.xml")

*.numUe = 1
**.ue[*].servingNodeId = 1
**.numBands = 6
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.mac.schedulingDisciplineDl = "MAXCI"
**.mac.schedulingDisciplineUl = "MAXCI"

# UE close to the eNB for a clean channel
*.eNB.mobility.initialX = 300m
*.eNB.mobility.initialY = 300m
*.ue[0].mobility.initialX = 320m
*.ue[0].mobility.initialY = 300m

#============= Downlink VoIP flow (server -> ue[0]) =============
# VoIP* packet names => "conversational" traffic category (Ip2Nic::getTrafficCategory),
# so the bearer's mode is taken from ip2nic.conversationalRlc (set per test).
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000
*.server.numApps = 1
*.server.app[0].typename = "VoipSender"
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].startTime = 0.05s
*.server.app[0].packetSize = 40B          # small: one SDU per PDU (no segmentation)
