#
# Simu5G RLC conformance suite -- NR base (single UE <-> gNB, standalone, DL flow).
#
# One NR UE, one gNB (nrServingNodeId 1), a downlink server->UE UDP/VoIP flow. NR UE
# <-> gNB flows are "NR bearers", so BearerManagement instantiates the Nr* entity
# profiles (soFraming=true => TS 38.322 path).
#
# Runtime RLC module names on this topology (peer id 1 = gNB, DRB 1):
#   UE  TX entity : <net>.ue[0].cellularNic.nrRlc-<mode>-tx-1-1   (wired to nrRlcMux)
#   gNB RX entity : <net>.gnb.cellularNic.rlc-<mode>-rx-1025-1    (Nr* type, base rlcMux)
#   PDU-on-wire (UE, NR leg)  : <net>.ue[0].cellularNic.nrRlcMux
#   PDU-on-wire (gNB)         : <net>.gnb.cellularNic.rlcMux
#
# NOTE (finalize on first build): SingleCell_Standalone.ned expects the scenario IPv4
# configurator XML (simulations/nr/standalone/demo.xml). See the same note in _lte.ini.
#
# SPDX-License-Identifier: LGPL-3.0-or-later
#
include _common.ini

[General]
# Wrapper network = SingleCell_Standalone + a `tester: ProtocolTester` submodule.
network = simu5g.tests.protocol.rlc.NrRlcTestNet

# IPv4 addressing (absolute path so it resolves from the opp_test work dir).
*.configurator.config = xmldoc("/home/attila/projects/Simu5G/simulations/nr/standalone/demo.xml")

*.numUe = 1
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

# Good geometry (from the standalone scenario)
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

#============= Downlink VoIP flow (server -> ue[0]) =============
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000
*.server.numApps = 1
*.server.app[0].typename = "VoipSender"
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].startTime = 0.05s
*.server.app[0].packetSize = 40B
