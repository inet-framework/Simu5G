#
# Simu5G RLC conformance suite -- settings shared by every test.
#
# Included by ini/_lte.ini and ini/_nr.ini. Keeps runs short, deterministic, and
# quiet. Each test's program is a named Define_ProtocolTest(<name>) selected via
# *.tester.testName; the `tester: ProtocolTester` submodule comes from the thin
# wrapper networks in ned/RlcTestNetworks.ned, which extend the stock Simu5G
# scenarios without modifying them. (The framework's Define_ProtocolTestProgram()
# self-attach alternative is not used here -- a --deep single-binary build over many
# programs needs them named; see README.)
#
# SPDX-License-Identifier: LGPL-3.0-or-later
#
[General]
sim-time-limit = 3s
seed-set = 0
**.vector-recording = false
**.scalar-recording = false
cmdenv-express-mode = true

# Deterministic geometry: stationary UE with a good channel to the serving cell, so
# ordinary loss-free RLC mechanisms (SN sequencing, polling, STATUS, reassembly) are
# exercised without stochastic HARQ/BLER interference.
**.mobility.typename = "StationaryMobility"

# The framework prints its verdict to stdout; %contains asserts it. Turn the raw
# event trace on (per test) with `*.protocolTester.logEvents = true` while authoring.
