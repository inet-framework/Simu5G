# ---------------------------------------------------------------------------
# Empty-world single-link Sionna config (Phase 1 walking skeleton).
#
# Requires the Simu5G_Sionna feature to be ENABLED at build time:
#     opp_featuretool enable Simu5G_Sionna   (then `make` from src/)
#
# Requires the offline artifact to be present at sionna_artifact/ . Generate it with
# the offline Sionna venv (NOT part of a normal build/run):
#     /home/zoli/Projects/OMNET/Sionna/venv/bin/python \
#         ../../../tools/sionna_precompute/precompute.py \
#         ../../../tools/sionna_precompute/scenario.example.json \
#         --out sionna_artifact
# ---------------------------------------------------------------------------

[General]
network = simu5g.simulations.NR.sionna.SionnaSingleLink
sim-time-limit = 1s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility / constraint area #####################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 200m
**.mobility.constraintAreaMaxY = 200m
**.mobility.constraintAreaMaxZ = 20m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
# MUST equal the artifact contract (num_bands = 1 in scenario.example.json) so the
# SionnaManager contract assertion (CAL-02) passes.
**.numBands = 1

############### Carrier frequency / numerology (artifact contract) ##################
# Carrier 3.5 GHz, SCS 30 kHz (numerology 1) — must match scenario.example.json.
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].numBands = 1

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 auto-configuration #################
*.configurator.config = xml("<config><interface among='eNB* eNodeB* enb* *Enb* gNB* gNodeB* gnb* *Gnb* upf* *Upf* pgw*' address='10.x.x.x' netmask='255.255.255.0'/><interface hosts='*' address='192.168.x.x' netmask='255.255.255.0'/></config>")

#======================================================================#
# SEAM-01: select SionnaChannelModel purely via the parametric typename
# string of the NIC (NO NED interface edit). This is the entire opt-in seam.
#======================================================================#
*.*.cellularNic.nrChannelModelType = "SionnaChannelModel"

# Point every SionnaChannelModel instance at the single network-scope manager
# (absolute module path resolved by getModuleByPath from any NIC depth).
*.*.cellularNic.nrChannelModel[*].sionnaManagerModule = "SionnaSingleLink.sionnaManager"

# Artifact location consumed by SionnaManager at init (manifest + path_gain.bin).
*.sionnaManager.artifactManifest = "sionna_artifact/manifest.json"

#======================================================================#
# Phase-1 inert statistical terms (Pitfall 3 / Assumption A3): the Sionna table
# already encodes propagation, so the inherited analytic statistical terms are
# suppressed to keep the run deterministic and the path gain Sionna-sourced.
#======================================================================#
*.*.cellularNic.nrChannelModel[*].shadowing = false
*.*.cellularNic.nrChannelModel[*].fading = false
*.*.cellularNic.nrChannelModel[*].dynamicLos = false
*.*.cellularNic.nrChannelModel[*].fixedLos = true

#======================================================================#
# Single-link geometry: place the gNB (Tx) and UE (Rx) at the artifact SSOT
# positions (scenario.example.json) so the in-sim geometry matches the offline
# PathSolver geometry and the empty-world Friis round-trip closes (CAL-01).
#======================================================================#
# gNB (Tx) at [0, 0, 10] m
*.gnb.mobility.typename = "StationaryMobility"
*.gnb.mobility.initialX = 0m
*.gnb.mobility.initialY = 0m
*.gnb.mobility.initialZ = 10m

# UE (Rx) at [100, 0, 1.5] m
*.numUe = 1
*.ue[0].nrServingNodeId = 1
*.ue[0].masterId = 1
*.ue[0].macCellId = 1
*.ue[0].nrMasterId = 1
*.ue[0].nrMacCellId = 1
*.ue[0].mobility.typename = "StationaryMobility"
*.ue[0].mobility.initialX = 100m
*.ue[0].mobility.initialY = 0m
*.ue[0].mobility.initialZ = 1.5m

#======================================================================#
# Minimal downlink traffic so the PHY computes a received SINR / path gain
# over the Sionna link (one VoIP DL flow gNB->UE).
#======================================================================#
*.ue[*].numApps = 1
*.server.numApps = 1
*.ue[*].app[0].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000
*.server.app[0].typename = "VoipSender"
*.server.app[0].packetSize = 40B
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].localPort = 3088
*.server.app[0].startTime = uniform(0s, 0.02s)
