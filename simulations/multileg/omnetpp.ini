# Multileg demo project for Simu5G (see src/simu5g/multileg/package.ned).
#
# Scenario A: a UE with two NR legs -- leg 1 served by gnb1, leg 2 by gnb2.
# The LTE leg (leg 0) is present but unattached. All legs are pinned: no
# handover, no dynamic cell association.

[General]
network = simu5g.simulations.multileg.MlMultiCell
sim-time-limit = 5s
seed-set = ${repetition}
**.routingRecorder.enabled = false
**.vector-recording = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

############### IPv4 configurator ################
*.configurator.config = xmldoc("./demo.xml")

############### Component carrier ################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.numNrCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.nrChannelModel2[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############### PHY ##############################
**.downlinkInterference = true
**.uplinkInterference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti

############### Node ids and leg pinning #########
*.gnb1.macNodeId = 1
*.gnb2.macNodeId = 2
*.ue[*].servingNodeId = 0        # LTE leg unattached
*.ue[*].nrServingNodeId = 1      # leg 1 -> gnb1
*.ue[*].nrServingNodeId2 = 2     # leg 2 -> gnb2
**.dynamicCellAssociation = false
**.enableHandover = false

############### Ml modules on the (stock) gNBs ###
*.gnb*.cellularNic.phy.typename = "simu5g.multileg.MlPhyGnb"
*.gnb*.cellularNic.ip2nic.typename = "simu5g.multileg.MlIp2Nic"
*.gnb*.cellularNic.legSelection.typename = "simu5g.multileg.MlLegSelection"

############### Positions (static) ###############
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 750m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.gnb1.mobility.initialX = 250m
*.gnb1.mobility.initialY = 500m
*.gnb2.mobility.initialX = 750m
*.gnb2.mobility.initialY = 500m
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialX = 500m
*.ue[*].mobility.initialY = 400m

############### X2 (topology parity; unused) #####
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"


#------------------------------------#
# Milestone A3: the extra leg attaches and carries traffic.
# One UL CBR flow with ToS >= 20, steered onto leg 2 by MlLegSelection's
# default policy; the DL direction (server -> UE) rides leg 1, since DL leg
# steering would need the core's TrafficFlowFilter (deliberately out of
# scope, see the plan).
[Config Leg2-UL]
*.numUe = 1
*.ue[*].numApps = 1
*.ue[*].app[*].typename = "CbrSender"
*.ue[*].app[*].packetSize = 100B
*.ue[*].app[*].samplingTime = 0.02s
*.ue[*].app[*].tos = 25
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].destPort = 3000
*.ue[*].app[*].localPort = 3088
*.ue[*].app[*].startTime = 0.05s

*.server.numApps = 1
*.server.app[*].typename = "CbrReceiver"
*.server.app[*].localPort = 3000


#------------------------------------#
# Milestone A5: two UL flows from the same UE, one per leg, selected per
# flow by ToS (ToS 10 -> leg 1, ToS 25 -> leg 2).
[Config TwoFlows-UL]
*.numUe = 1
*.ue[*].numApps = 2
*.ue[*].app[*].typename = "CbrSender"
*.ue[*].app[*].packetSize = 100B
*.ue[*].app[*].samplingTime = 0.02s
*.ue[*].app[0].tos = 10
*.ue[*].app[1].tos = 25
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].destPort = 3000 + ancestorIndex(0)
*.ue[*].app[*].localPort = 3088 + ancestorIndex(0)
*.ue[*].app[*].startTime = 0.05s

*.server.numApps = 2
*.server.app[*].typename = "CbrReceiver"
*.server.app[*].localPort = 3000 + ancestorIndex(0)
