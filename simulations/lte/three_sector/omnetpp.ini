[General]
abstract = true
sim-time-limit = 20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP
**.vector-recording = false

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

############### General PHY parameters ##############
**.downlinkInterference = true
**.uplinkInterference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm

############### Floorplan parameters ################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 1300m
**.mobility.constraintAreaMaxY = 700m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

#------------------------------------#
# Config ThreeSectorSite
#
# Base configuration of a three-sector site in an LTE deployment
#
[Config ThreeSectorSite]
network = simu5g.simulations.lte.networks.ThreeSectorSite
description = "Base configuration, do not run this config!"
abstract = true

**.numBands = 25

############### The site: three sectors on one mast ################
# The three cells stand at one position and radiate in three directions,
# 120 degrees apart.
*.eNodeB*.mobility.initialX = 800m
*.eNodeB*.mobility.initialY = 350m
*.eNodeB*.cellularNic.antenna.txDirection = "ANISOTROPIC"
*.eNodeB1.cellularNic.antenna.txAngle = 30deg
*.eNodeB2.cellularNic.antenna.txAngle = 150deg
*.eNodeB3.cellularNic.antenna.txAngle = 270deg

# One site name makes the three cells the sectors of one site for the channel
# model: a UE's links to them share one LOS state and one shadowing
# realization (TR 38.901 7.5 Step 4), so which sector is the strongest at a
# UE follows the antenna patterns. Without it each cell is a site of its own
# and draws its own.
*.eNodeB*.site = "site1"
**.dynamicLos = true
**.shadowing = true

############### X2 configuration #################
# The sectors have two x2ppp interfaces each, and peer as follows:
# - eNodeB1%x2ppp0 <--> eNodeB2%x2ppp0
# - eNodeB1%x2ppp1 <--> eNodeB3%x2ppp0
# - eNodeB2%x2ppp1 <--> eNodeB3%x2ppp1
*.eNodeB*.numX2Apps = 2                                        # one x2App per peering node
*.eNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.eNodeB1.x2App[0].client.connectAddress = "eNodeB2%x2ppp0"
*.eNodeB1.x2App[1].client.connectAddress = "eNodeB3%x2ppp0"
*.eNodeB2.x2App[0].client.connectAddress = "eNodeB1%x2ppp0"
*.eNodeB2.x2App[1].client.connectAddress = "eNodeB3%x2ppp1"
*.eNodeB3.x2App[0].client.connectAddress = "eNodeB1%x2ppp1"
*.eNodeB3.x2App[1].client.connectAddress = "eNodeB2%x2ppp1"

############## UE configuration ##################
*.numUe = 6
# A UE attaches to the strongest sector at the beginning, and hands over to
# the next one as it crosses a sector boundary
**.dynamicCellAssociation = true
**.enableHandover = true

# The UEs circle the mast at 300 m, 30 m/s, starting all around it: in 20 s
# each of them passes about a third of the circle, and so one sector boundary
*.ue[*].mobility.typename = "CircleMobility"
*.ue[*].mobility.cx = 800m
*.ue[*].mobility.cy = 350m
*.ue[*].mobility.r = 300m
*.ue[*].mobility.speed = 30mps
*.ue[*].mobility.startAngle = 60deg * ancestorIndex(1)
*.ue[*].servingNodeId = 1
#------------------------------------#

#------------------------------------#
# Config CBR-DL
#
# CBR downlink traffic from a remote server to the UEs circling the site
#
[Config CBR-DL]
extends = ThreeSectorSite
description = "three sectors of one site; CBR DL traffic to UEs circling the mast"

*.ue[*].numApps = 1
*.server.numApps = 6
*.ue[*].app[*].typename = "CbrReceiver"
*.ue[*].app[*].localPort = 3000
*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 100B
*.server.app[*].samplingTime = 0.02s
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#
