#
# Shared Sionna settings (Plan A). Include this from a scenario's omnetpp.ini and
# point `network` at a <YourNetwork>Sionna wrapper (a 3-line NED that extends the
# original network and adds a `sionnaManager: SionnaManager` submodule - generate
# them with sionnaize.py).
#
#   [Config Foo-Sionna]
#   extends = <the original config>
#   include ../sionna/sionna-common.ini
#   network = simu5g.simulations.nr.sionna.generated.FooSionna
#
# The channel model is switched on every NR node, and the SionnaManager generates
# the per-(link,RB) table at startup with the deterministic two-ray backend (no
# GPU, no committed artifact needed). Static scenarios only (Plan A v1).
#

# --- switch both ends to the Sionna channel model ---
**.cellularNic.lteChannelModelType = "SionnaChannelModel"   # gNB / eNB side
**.cellularNic.nrChannelModelType  = "SionnaChannelModel"   # NR UE side

# --- SionnaManager: generate the table via the bundled generator ---
*.sionnaManager.backend = "tworay"          # deterministic; set "sionna" for real RT
*.sionnaManager.granularity = "perRb"
*.sionnaManager.interferenceMode = "noiseLimited"   # set "allPairs" for inter-cell
*.sionnaManager.channelTableFile = ""       # empty -> generate (don't load an artifact)
*.sionnaManager.cacheDir = "sionna_cache"   # cached by request hash; reused on rerun
*.sionnaManager.pythonExecutable = "/home/zoli/Projects/OMNET/DEVEL/omnetpp/.venv/bin/python3"
*.sionnaManager.sionnaScript = "/home/zoli/Projects/OMNET/Simu5G/src/simu5g/stack/phy/channelmodel/sionna/sionna_rt.py"

# NOTE on node heights: the flat-ground two-ray model is degenerate when Tx and Rx
# are at the same height (e.g. both z=0). For meaningful path gains, give the nodes
# height IN YOUR [Config ...] SECTION (so it overrides the scenario's own settings),
# bumping the z constraint first, e.g.:
#     **.mobility.constraintAreaMaxZ = 50m
#     *.gnb*.mobility.initialZ = 25m
#     *.ue*.mobility.initialZ  = 1.5m
# (Putting these here would lose to the original scenario's [General], and forcing a
# height outside its z constraint area is a runtime error.)

# --- record results to results/<config>-<run>.{sca,vec} ---
result-dir = results
output-scalar-file = "${resultdir}/${configname}-${repetition}.sca"
output-vector-file = "${resultdir}/${configname}-${repetition}.vec"
**.scalar-recording = true
**.vector-recording = true
