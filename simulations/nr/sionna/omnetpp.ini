[General]
# Reuse the NR standalone scenario definitions (positions, attach, apps).
include ../standalone/omnetpp.ini

#------------------------------------#
# Config Sionna
#
# NR standalone single cell whose channel comes from a ray-traced Sionna table
# (Plan A). This config loads a committed, frozen channel-table artifact, so it
# is fully portable and deterministic - it needs neither Python nor Sionna. To
# regenerate the artifact from the ray tracer, see [Config SionnaLive].
#
[Config Sionna]
extends = VoIP-DL
network = simu5g.simulations.nr.sionna.SionnaSingleCell
sim-time-limit = 2s

*.configurator.config = xmldoc("demo.xml")

# give the nodes height so the flat-ground two-ray model is non-degenerate
**.mobility.constraintAreaMaxZ = 50m
*.gnb.mobility.initialZ = 25m
*.ue[*].mobility.initialZ = 1.5m

# select the Sionna channel model on both ends
*.gnb.cellularNic.lteChannelModelType = "SionnaChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "SionnaChannelModel"

# load the committed, frozen channel table (no subprocess; deterministic)
*.sionnaManager.granularity = "perRb"
*.sionnaManager.interferenceMode = "noiseLimited"
*.sionnaManager.channelTableFile = "channel_table.json"


#------------------------------------#
# Config SionnaLive
#
# Same scenario, but (re)generates the channel table by spawning the ray-tracing
# generator (sionna_rt.py) as a subprocess. The 'tworay' backend is deterministic
# and needs no GPU; set backend = "sionna" to use real Sionna RT (must be
# installed). The pythonExecutable / sionnaScript paths are machine specific.
#
[Config SionnaLive]
extends = Sionna
*.sionnaManager.channelTableFile = ""       # ignore the committed artifact
*.sionnaManager.backend = "tworay"
*.sionnaManager.pythonExecutable = "/home/zoli/Projects/OMNET/DEVEL/omnetpp/.venv/bin/python3"
*.sionnaManager.sionnaScript = "/home/zoli/Projects/OMNET/Simu5G/src/simu5g/stack/phy/channelmodel/sionna/sionna_rt.py"
*.sionnaManager.cacheDir = "sionna_cache"


#------------------------------------#
# Config SionnaCompare
#
# Plan A §7 validation: the UE runs a CompareChannelModel that evaluates the
# built-in (reference) and Sionna (candidate) models on identical DL inputs and
# records per-call deltas. primary = reference (default) keeps the run RNG-neutral
# (identical to a plain built-in run) with Sionna deltas logged on top.
#
[Config SionnaCompare]
extends = Sionna

# UE NIC with the three NR channel models (compare + reference + candidate)
*.ue[*].cellularNic.typename = "simu5g.simulations.nr.sionna.NrNicUeCompare"
# override the SionnaChannelModel type inherited from [Config Sionna]
*.ue[*].cellularNic.nrChannelModelType = "CompareChannelModel"
*.ue[*].cellularNic.referenceChannelModelType = "NrChannelModel_3GPP38_901"
*.ue[*].cellularNic.candidateChannelModelType = "SionnaChannelModel"

# wire the CompareChannelModel to its two inner siblings
*.ue[*].cellularNic.nrChannelModel[*].referenceModule = "^.refNrChannelModel[0]"
*.ue[*].cellularNic.nrChannelModel[*].candidateModule = "^.candNrChannelModel[0]"
*.ue[*].cellularNic.nrChannelModel[*].primary = "reference"

# the gNB keeps the built-in model (the comparison happens at the UE, DL)
*.gnb.cellularNic.lteChannelModelType = "NrChannelModel_3GPP38_901"

# Disable random shadowing/fading on the built-in models. This (a) realizes the
# Plan A §7 "large-scale only" fairness mode (38.901 path loss vs the Sionna mean)
# and (b) avoids the built-in model's cross-model shadowing/fading map coupling,
# which casts the peer's channel model to LteRealisticChannelModel - the UE's model
# is now a CompareChannelModel, so those accesses must not happen.
*.gnb.cellularNic.channelModel[*].shadowing = false
*.gnb.cellularNic.channelModel[*].fading = false
*.ue[*].cellularNic.refNrChannelModel[*].shadowing = false
*.ue[*].cellularNic.refNrChannelModel[*].fading = false
