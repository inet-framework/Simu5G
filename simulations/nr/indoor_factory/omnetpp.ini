[General]
abstract = true
sim-time-limit = 20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP
**.vector-recording = false

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

#------------------------------------#
# Config Hall
#
# Base configuration of a private 5G network in a factory hall: two gNBs and
# four AGVs in a hall of 120 m x 60 m, the small hall of the TR 38.901
# calibration (Table 7.8-7), in an NR standalone deployment at 3.5 GHz
#
[Config Hall]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
description = "Base configuration, do not run this config!"
abstract = true

############### Floorplan parameters ################
# the AGVs' track, 10 m from the walls of the hall (the UE lines come first:
# the first matching line counts)
*.ue[*].mobility.constraintAreaMinX = 10m
*.ue[*].mobility.constraintAreaMinY = 10m
*.ue[*].mobility.constraintAreaMaxX = 110m
*.ue[*].mobility.constraintAreaMaxY = 50m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 120m
**.mobility.constraintAreaMaxY = 60m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### CA configuration #################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.phy.componentCarrierModules = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.nrPhy.componentCarrierModules = "carrierAggregation.componentCarrier[0]"

############### The channel in the hall ################
# The Indoor Factory scenario is TR 38.901's, the study of the NR channel
# model. A configuration below selects the sub-scenario of the two cells
# (*.gnb*.scenario) and with it the clutter of the hall, which the base station
# gives by default as in the calibration: 20 % of the floor, 2 m high, 10 m in
# size where the clutter is sparse; 60 %, 6 m and 2 m where it is dense
# (*.gnb*.clutterDensity, clutterHeight, clutterSize).
#
# The LOS state of a link is drawn from the hall's LOS probability, and drawn
# again as the AGV moves. The two cells are on one carrier and interfere.
**.dynamicLos = true
**.shadowing = true
**.downlinkInterference = true
**.uplinkInterference = true
# The delay spread of the fading is not the scenario's: this is the study's
# median for a hall of this size (Table 7.5-6 Part-3), where the default is
# an urban macrocell's 363 ns
**.nrChannelModel[*].delayRms = 55ns

**.eNodeBTxPower = 24dBm
**.ueTxPower = 23dBm

############### BS position #################
# 60 m apart on the long axis of the hall
*.gnb1.mobility.initialX = 30m
*.gnb1.mobility.initialY = 30m
*.gnb2.mobility.initialX = 90m
*.gnb2.mobility.initialY = 30m

############### X2 configuration #################
*.gnb*.numX2Apps = 1                                        # one x2App per peering node
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

############## UE configuration ##################
*.numUe = 4
# An AGV attaches to the stronger cell at the beginning, and hands over as it
# passes from one half of the hall to the other
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

# The AGVs drive around the rectangular track (see the floorplan) at 5 m/s
# (18 km/h), each starting from another corner: 100 m in 20 s
*.ue[*].mobility.typename = "RectangleMobility"
*.ue[*].mobility.startPos = ancestorIndex(1)
*.ue[*].mobility.speed = 5mps

############## Traffic ##################
# CBR downlink traffic from a remote server to the AGVs
*.ue[*].numApps = 1
*.server.numApps = 4
*.ue[*].app[*].typename = "CbrReceiver"
*.ue[*].app[*].localPort = 3000
*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 1000B
*.server.app[*].samplingTime = 0.0015s
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#

#------------------------------------#
# Config InF-SL
#
# Sparse clutter, low base stations: the gNB antennas are among the
# machinery, at the height of the AGVs' antennas (1.5 m), below the clutter
#
[Config InF-SL]
extends = Hall
description = "factory hall with sparse clutter, gNB antennas below the clutter"
*.gnb*.scenario = "INDOOR_FACTORY_SL"
*.gnb*.cellularNic.antenna.mobility.offsetZ = 1.5m
#------------------------------------#

#------------------------------------#
# Config InF-DL
#
# Dense clutter, low base stations: almost every link beyond a few metres is
# NLOS
#
[Config InF-DL]
extends = Hall
description = "factory hall with dense clutter, gNB antennas below the clutter"
*.gnb*.scenario = "INDOOR_FACTORY_DL"
*.gnb*.cellularNic.antenna.mobility.offsetZ = 1.5m
#------------------------------------#

#------------------------------------#
# Config InF-SH
#
# Sparse clutter, high base stations: the gNB antennas are at 8 m, above the
# clutter, and nearly every link is in LOS
#
[Config InF-SH]
extends = Hall
description = "factory hall with sparse clutter, gNB antennas above the clutter"
*.gnb*.scenario = "INDOOR_FACTORY_SH"
*.gnb*.cellularNic.antenna.mobility.offsetZ = 8m
#------------------------------------#

#------------------------------------#
# Config InF-DH
#
# Dense clutter, high base stations: the gNB antennas are at 8 m, above the
# 6 m clutter
#
[Config InF-DH]
extends = Hall
description = "factory hall with dense clutter, gNB antennas above the clutter"
*.gnb*.scenario = "INDOOR_FACTORY_DH"
*.gnb*.cellularNic.antenna.mobility.offsetZ = 8m
#------------------------------------#

#------------------------------------#
# Config InF-HH
#
# Both ends above the clutter: gNB antennas at 8 m, and the UEs' antennas at
# 3 m, above the 2 m clutter (a crane, or an antenna on a mast of the AGV).
# Every link is in LOS
#
[Config InF-HH]
extends = Hall
description = "factory hall, gNB and UE antennas above the clutter"
*.gnb*.scenario = "INDOOR_FACTORY_HH"
*.gnb*.cellularNic.antenna.mobility.offsetZ = 8m
*.ue[*].cellularNic.antenna.mobility.offsetZ = 3m
#------------------------------------#
