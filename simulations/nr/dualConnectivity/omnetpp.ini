[General]
abstract = true
sim-time-limit=20s
seed-set = ${repetition}

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec

**.vector-recording = false
**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP
**.routingRecorder.enabled = false

############ Floorplan definition #################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

**.targetBler = 0.01
**.blerShift = 5

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config DualConnectivity
#
# General topology configuration for the exemplary scenario for Dual Connectivity
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity]
network = simu5g.simulations.nr.networks.SingleCell_withSecondaryGnb
sim-time-limit=20s
description = "Base configuration, do not run this config!"
abstract = true

############### e/gNodeB configuration #################
*.masterEnb.mobility.initialX = 300m
*.masterEnb.mobility.initialY = 300m
*.secondaryGnb.mobility.initialX = 600m
*.secondaryGnb.mobility.initialY = 300m

# the LTE eNodeB must use NR PDCP entities to exploit Dual Connectivity
*.masterEnb.hasD2D = true
*.masterEnb.cellularNic.ip2nic.isNr = true
*.masterEnb.cellularNic.rrc.bearerManagement.pdcpEntityModuleType = "simu5g.stack.pdcp.NrPdcpEntity"
*.secondaryGnb.masterId = 1
**.dualConnectivityEnabled = true

############### X2 configuration #################
*.*nb.numX2Apps = 1    # one x2App per peering node
*.*nb.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.masterEnb.x2App[0].client.connectAddress = "secondaryGnb%x2ppp0"
*.secondaryGnb.x2App[0].client.connectAddress = "masterEnb%x2ppp0"

############## UE configuration ##################
*.numUe = 1

# connect the UE's NIC to the corresponding serving eNB
*.ue[0].servingNodeId = 1
*.ue[0].nrServingNodeId = 2

# UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#





#------------------------------------#
# Config VoIP-DL
#
# General configuration for Voice-over-IP DL traffic to the UE
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity-VoIP-DL]
extends = DualConnectivity
description = "Base configuration, do not run this config!"
abstract = true

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[*].localPort = 3000+ancestorIndex(0)

*.server.app[*].typename = "VoipSender"
*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]" # obtain the address of the client by reading its index in the array of udp Apps
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].destPort = 3000+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# Config VoIP-UL
#
# General configuration for Voice-over-IP UL traffic from the UE
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity-VoIP-UL]
extends = DualConnectivity
description = "Base configuration, do not run this config!"
abstract = true

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 1000+ancestorIndex(0)

*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].destPort = 1000+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
#------------------------------------#





###########################
# Runnable configurations #
###########################

# Which path a flow takes is chosen from the Type of Service (TOS) field its packets carry:
# - use master eNB if tos < 10
# - use secondary gNB if 10 <= tos < 20
# - use split bearer if tos >= 20
#
# Which leg of a bearer carries a given PDU is the leg splitter's legSelection
# expression, evaluated per packet; its default implements the policy above, so this
# scenario needs no configuration of its own.

#------------------------------------#
[Config DualConn-MasterOnly-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, master only, Voice-over-IP (downlink)"
*.server.app[*].tos = -1
#------------------------------------#

#------------------------------------#
[Config DualConn-MasterOnly-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, master only, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = -1
#------------------------------------#

#------------------------------------#
[Config DualConn-SecondaryOnly-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, secondary only, Voice-over-IP (downlink)"
*.server.app[*].tos = 10
#------------------------------------#

#------------------------------------#
[Config DualConn-SecondaryOnly-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, secondary only, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = 10
#------------------------------------#



#------------------------------------#
# In this configuration, one UE has TWO independent DL connections, one
# going through the LTE eNodeB, the other one through the gNodeB
#
[Config DualConn-MasterPlusSecondary-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, master and secondary, Voice-over-IP (downlink)"

# One bearer per ToS value, matching the two flows' distinct markings
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "epc", filters: ["expr(ipv4.typeOfService == 10)"], lcg: 0, rlcMode: "UM"},
    {coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM"}
    ]
# one UDP application for each user
*.ue[*].numApps = 2
# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 2
*.server.app[0].tos = -1
*.server.app[1].tos = 10
#------------------------------------#



#------------------------------------#
# In this configuration, one UE has TWO independent UL connections, one
# going through the LTE eNodeB, the other one through the gNodeB
#
[Config DualConn-MasterPlusSecondary-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, master and secondary, Voice-over-IP (uplink)"

# One bearer per ToS value, matching the two flows' distinct markings
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "epc", filters: ["expr(ipv4.typeOfService == 10)"], lcg: 0, rlcMode: "UM"},
    {coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM"}
    ]
# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 2
# one UDP application for each user
*.ue[*].numApps = 2
*.ue[*].app[0].tos = -1
*.ue[*].app[1].tos = 10
#------------------------------------#




#------------------------------------#
# In this configuration, one UE has one DL connection, exploiting Split Bearer feature
#
[Config DualConn-SplitBearer-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, split bearer, Voice-over-IP (downlink)"
*.server.app[*].tos = 20
#------------------------------------#


#------------------------------------#
# In this configuration, one UE has one UL connection, exploiting Split Bearer feature
#
[Config DualConn-SplitBearer-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, split bearer, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = 20

#------------------------------------#

###############################################
# Bearer types stated by their configuration  #
###############################################

# The configurations above choose a path per packet, from the TOS field. The ones below
# state it instead, as the bearer's own configuration: which cell groups serve a bearer
# is its "legs", so a definition decides whether it is an MCG bearer, an SCG bearer or a
# split bearer (TS 37.340). Traffic is unmarked throughout -- nothing here depends on the
# TOS field -- and every flow lands on the one bearer the definition describes.

#------------------------------------#
# The bearer is served by the master cell group only: the secondary gNB carries none of
# this UE's data, which the per-packet policy cannot express (it can only send an
# individual packet one way or the other, on a bearer that always has both legs).
#
[Config DualConn-McgBearer-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, MCG bearer stated by its configuration (downlink)"
*.server.app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG"]}]
#------------------------------------#

#------------------------------------#
# The bearer is served by both cell groups, and its definition also states which leg
# carries a given PDU (legSelection, evaluated per PDU by the bearer's leg splitter).
#
[Config DualConn-SplitBearer-Configured-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, split bearer stated by its configuration (downlink)"
*.server.app[*].tos = -1
# alternate PDUs between the two legs; the traffic is unmarked, so the splitter's default
# policy (which reads the TOS field) would put all of it on the master's leg
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG", "SCG"],
                       legSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#


#######################################################
# NE-DC: an NR master with an LTE secondary           #
#######################################################

# The mirror image of the configurations above: the gNodeB is the master node and the
# eNodeB is its secondary, so the UE is anchored on its NR stack and its LTE stack carries
# the secondary cell group. Data-plane traffic enters at the gNodeB.
#
# The core network is still the EPC, so these are "eps" bearers with no SDAP. A real
# NR-anchored deployment pairs an NR master with a 5GC, which would make them "5gc" bearers
# and put SDAP into a dual-connectivity stack for the first time; that is left until the
# QoS-flow work lands.
#
# All bearer shapes work: the anchor (MCG) leg is the gNodeB's radio, and a split bearer's
# secondary leg reaches the eNodeB -- the splitter reads the anchor's technology off the
# flow's ids, so leg 1 translates to the UE's LTE stack here, where under EN-DC it is the
# NR one.

#------------------------------------#
[Config NeDualConnectivity]
network = simu5g.simulations.nr.networks.SingleCell_withSecondaryEnb
sim-time-limit = 20s
description = "Base configuration, do not run this config!"
abstract = true

############### e/gNodeB configuration #################
*.masterGnb.mobility.initialX = 300m
*.masterGnb.mobility.initialY = 300m
*.secondaryEnb.mobility.initialX = 600m
*.secondaryEnb.mobility.initialY = 300m

*.secondaryEnb.masterId = 1
**.dualConnectivityEnabled = true

# a gNodeB expects a 5GC gateway; this network keeps the EPC, so point it at the PGW
*.masterGnb.gateway = "pgw"

############### X2 configuration #################
*.*nb.numX2Apps = 1    # one x2App per peering node
*.*nb.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.masterGnb.x2App[0].client.connectAddress = "secondaryEnb%x2ppp0"
*.secondaryEnb.x2App[0].client.connectAddress = "masterGnb%x2ppp0"

############## UE configuration ##################
*.numUe = 1

# the UE's NR stack faces the master gNodeB, its LTE stack the secondary eNodeB
*.ue[0].nrServingNodeId = 1
*.ue[0].servingNodeId = 2

*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#

#------------------------------------#
[Config NeDualConn-VoIP-DL]
extends = NeDualConnectivity
description = "NE-DC, Voice-over-IP (downlink)"

*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[*].localPort = 3000+ancestorIndex(0)

*.server.app[*].typename = "VoipSender"
*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]"
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].destPort = 3000+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
*.server.app[*].tos = -1
#------------------------------------#

#------------------------------------#
[Config NeDualConn-VoIP-UL]
extends = NeDualConnectivity
description = "NE-DC, Voice-over-IP (uplink)"

*.ue[*].numApps = 1
*.server.numApps = 1

*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 3000+ancestorIndex(0)

*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].packetSize = 40B
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].destPort = 3000+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
*.ue[*].app[*].tos = -1
#------------------------------------#

#------------------------------------#
# The bearer is served by both cell groups, stated by its configuration; PDUs alternate
# between the gNodeB's radio (anchor leg) and the eNodeB's (secondary leg, via X2).
#
[Config NeDualConn-SplitBearer-Configured-DL]
extends = NeDualConn-VoIP-DL
description = "NE-DC, split bearer stated by its configuration (downlink)"
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG", "SCG"],
                       legSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#
