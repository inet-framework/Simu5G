[General]
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false
**.vector-record-empty = false
**.routingRecorder.enabled = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinX = -300m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 2300m
**.mobility.constraintAreaMaxY = 400m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------- #
# Config "Highway"
#
# TR 37.885 highway calibration scenario (WP-G): 170 out-of-coverage vehicles
# on a 2 km, 6-lane highway (3 lanes per direction), broadcasting CAM-style
# 300B alerts at 10 Hz over the mode-2 sensing-based sidelink and the
# TR 37.885 highway channel. The network-level slStatsCollector records
# PRR/PIR per transmitter-receiver distance bin (see README).
#
[Config Highway]
network = simu5g.simulations.nr.sidelink.highway.SidelinkHighway
sim-time-limit = 10s

*.numUes = 170
*.ue[*].hasSidelink = true

# TR 37.885 highway drop: 6 lanes (3 per direction), 4 m lane spacing,
# uniform positions along the road (equivalent to the Poisson drop of clause
# 6.1.2 for a fixed vehicle count), constant speed per direction (100 km/h).
# The road is a gentle arc (radius 4000 m) - see SidelinkHighway.ned; lane l
# drives on radius 3990+4l, directions split between inner and outer lanes.
*.ue[*].mobility.typename = "CircleMobility"
*.ue[*].mobility.cx = 1000m
*.ue[*].mobility.cy = 4150m
*.ue[*].mobility.r = 3990m + 4m * (parentIndex() % 6)
*.ue[*].mobility.speed = (parentIndex() % 6 < 3) ? 27.78mps : -27.78mps
*.ue[*].mobility.startAngle = uniform(256deg, 284deg)

# pool: 5.9 GHz, mu=1, 5 subchannels x 10 PRBs (~20 MHz), 100 ms reservation period
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [100], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

*.ue[*].cellularNic.slChannelModel.typename = "simu5g.stack.sidelink.phy.Tr37885ChannelModel"
*.ue[*].cellularNic.slChannelModel.scenario = "highway"

# with real link adaptation (SlMcsTable, D15) the MCS must be chosen so a
# whole 300B CAM fits one TB: MCS 16 -> TBS 349B on the 10-PRB subchannel
*.ue[*].cellularNic.slMac.grantMcs = 16

# CAM-style traffic: 300B @ 10 Hz, every UE sends and receives
*.ue[*].numApps = 2
*.ue[*].app[0].typename = "AlertSender"
*.ue[*].app[0].localPort = 3088
*.ue[*].app[0].startTime = uniform(0s, 0.1s)
*.ue[*].app[0].period = 0.1s
*.ue[*].app[0].packetSize = 300B
*.ue[*].app[0].destAddress = "224.0.0.10"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[1].typename = "AlertReceiver"
*.ue[*].app[1].localPort = 1000

# record the SL PHY vectors (SL-RSRP/SINR/CBR/frame loss) on a few UEs for
# the analysis charts (highway.anf); everything else stays scalars-only
*.ue[0..7].cellularNic.slPhy.**.vector-recording = true

# ----------------------------------------------------------------------------- #
# Config "Highway-Small"
#
# Fingerprint-row variant: a reduced UE count for the automated regression
# suite (short run, small fingerprint state).
#
[Config Highway-Small]
extends = Highway
description = "reduced variant for regression testing"
sim-time-limit = 2s

*.numUes = 40

# ----------------------------------------------------------------------------- #
# Config "Highway-Platoon"
#
# Milestone M6 (WP-I): groupcast with PSFCH option 1 (distance-gated
# NACK-only feedback). ue[0..4] form a platoon in lane 0 at ~60 m spacing;
# the leader ue[0] groupcasts 300B platoon messages at 10 Hz to
# 224.0.0.20 over a groupcast SLRB with MCR 150 m: on a lost TB, only
# members within 150 m of the sender NACK (ue[1] at 60 m, ue[2] at 120 m;
# ue[3]/ue[4] at 180/240 m stay silent), and silence at the feedback
# deadline means success. The other 35 vehicles keep broadcasting CAMs
# (blind mode) on the same pool - their PSSCH traffic also demonstrates
# half-duplex PSFCH losses (DTX) at the leader.
#
[Config Highway-Platoon]
extends = Highway-Small
*.configurator.config = xmldoc("./demo-platoon.xml")

# the platoon: 5 vehicles in lane 0 (1 deg of arc = 69.6 m at r = 3990 m)
*.ue[0..4].mobility.r = 3990m
*.ue[0..4].mobility.speed = 27.78mps
*.ue[0].mobility.startAngle = 266deg
*.ue[1].mobility.startAngle = 266.86deg
*.ue[2].mobility.startAngle = 267.72deg
*.ue[3].mobility.startAngle = 268.58deg
*.ue[4].mobility.startAngle = 269.44deg

# platoon members carry the groupcast SLRB on top of the broadcast one
# (option 1, MCR 150 m); NOTE: the specific pattern must precede *.ue[*]
*.ue[0..4].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [100], psfchPeriod: 4, \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" }, \
                  { dstL2Id: 0xA0, castType: "groupcast", drb: 2, \
                    rlcType: "UM", destAddress: "224.0.0.20", \
                    mcr: 150m, psfchMode: "nackOnly" } ] }

# the shared pool gains PSFCH slots (period 4); non-platoon UEs stay on
# broadcast (blind), the pool geometry is unchanged
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [100], psfchPeriod: 4, \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# platoon traffic: the leader groupcasts on top of everyone's CAMs
*.ue[0..4].numApps = 3
*.ue[0].app[2].typename = "AlertSender"
*.ue[0].app[2].localPort = 3090
*.ue[0].app[2].startTime = uniform(0s, 0.1s)
*.ue[0].app[2].period = 0.1s
*.ue[0].app[2].packetSize = 300B
*.ue[0].app[2].destAddress = "224.0.0.20"
*.ue[0].app[2].destPort = 2000
*.ue[1..4].app[2].typename = "AlertReceiver"
*.ue[1..4].app[2].localPort = 2000

# ----------------------------------------------------------------------------- #
# Config "Highway-Platoon-AckNack"
#
# Groupcast PSFCH option 2: every platoon member answers ACK/NACK on its
# own member-rank-derived PSFCH resource; the leader frees the TB early
# once all 4 ACKs arrive, retransmits on any NACK, and resolves missing
# feedback per psfchDtxPolicy. No MCR gate.
#
[Config Highway-Platoon-AckNack]
extends = Highway-Platoon

*.ue[0..4].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [100], psfchPeriod: 4, \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" }, \
                  { dstL2Id: 0xA0, castType: "groupcast", drb: 2, \
                    rlcType: "UM", destAddress: "224.0.0.20", \
                    psfchMode: "ackNack" } ] }

# ----------------------------------------------------------------------------- #
# Config "Highway-300"
#
# Scalability check: same scenario, denser traffic (300 vehicles) to probe
# runtime/behavior as UE count grows.
#
[Config Highway-300]
extends = Highway
description = "scalability check"
sim-time-limit = 2s

*.numUes = 300
