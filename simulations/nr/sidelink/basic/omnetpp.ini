[General]
sim-time-limit = 2s
warmup-period = 0s
**.routingRecorder.enabled = false

output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------- #
# Config "OutOfCoverage"
#
# WP-A spike: two cell-less NrUes (no gNodeB in the network, servingNodeId=0),
# one of them attempts to send periodic alert messages to a multicast group.
# Expected with no sidelink support: init completes, packets are dropped by
# TechnologyDecision ("not attached to any serving node").
#
[Config OutOfCoverage]
network = simu5g.simulations.nr.sidelink.basic.SidelinkBasic

*.numUes = 2

*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 0

*.ue[0].mobility.initialX = 290m
*.ue[0].mobility.initialY = 350m
*.ue[1].mobility.initialX = 310m
*.ue[1].mobility.initialY = 350m

### Traffic configuration ###
*.ue[*].numApps = 1

# Transmitter
*.ue[0].app[*].typename = "AlertSender"
*.ue[0].app[*].localPort = 3088
*.ue[0].app[*].startTime = uniform(0s, 0.02s)
*.ue[0].app[*].stopTime = 1.9s
*.ue[0].app[*].destAddress = "224.0.0.10"       # IP address of the multicast group
*.ue[0].app[*].destPort = 1000

# Receiver (member of the multicast group, see demo.xml)
*.ue[1].app[*].typename = "AlertReceiver"
*.ue[1].app[*].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "Broadcast"
#
# Milestone M1 (WP-C): the same two out-of-coverage UEs, now with the sidelink
# leg enabled. ue[0]'s alert messages are delivered app-to-app over PC5
# (SL-SDAP-less WP-C pipe: ip2nic -> PDCP -> RLC UM -> SL MAC -> SL PHY),
# using a static preconfigured periodic grant per UE and ideal PHY decoding.
#
[Config Broadcast]
extends = OutOfCoverage

*.ue[*].hasSidelink = true

*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# WP-C static grants: one slot offset per UE (collision-free by construction)
*.ue[0].cellularNic.slMac.staticGrantSlotOffset = 0
*.ue[1].cellularNic.slMac.staticGrantSlotOffset = 1
