[General]
sim-time-limit = 2s
warmup-period = 0s
**.routingRecorder.enabled = false

output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------- #
# Config "OutOfCoverage"
#
# WP-A spike: two cell-less NrUes (no gNodeB in the network, servingNodeId=0),
# one of them attempts to send periodic alert messages to a multicast group.
# Expected with no sidelink support: init completes, packets are dropped by
# TechnologyDecision ("not attached to any serving node").
#
[Config OutOfCoverage]
network = simu5g.simulations.nr.sidelink.basic.SidelinkBasic

*.numUes = 2

*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 0

*.ue[0].mobility.initialX = 290m
*.ue[0].mobility.initialY = 350m
*.ue[1].mobility.initialX = 310m
*.ue[1].mobility.initialY = 350m

### Traffic configuration ###
*.ue[*].numApps = 1

# Transmitter
*.ue[0].app[*].typename = "AlertSender"
*.ue[0].app[*].localPort = 3088
*.ue[0].app[*].startTime = uniform(0s, 0.02s)
*.ue[0].app[*].stopTime = 1.9s
*.ue[0].app[*].destAddress = "224.0.0.10"       # IP address of the multicast group
*.ue[0].app[*].destPort = 1000

# Receiver (member of the multicast group, see demo.xml)
*.ue[1].app[*].typename = "AlertReceiver"
*.ue[1].app[*].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "Broadcast"
#
# Milestone M1 (WP-C): the same two out-of-coverage UEs, now with the sidelink
# leg enabled. ue[0]'s alert messages are delivered app-to-app over PC5
# (SL-SDAP-less WP-C pipe: ip2nic -> PDCP -> RLC UM -> SL MAC -> SL PHY),
# using a static preconfigured periodic grant per UE and ideal PHY decoding.
#
[Config Broadcast]
extends = OutOfCoverage

*.ue[*].hasSidelink = true

*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# WP-C static grants: one slot offset per UE (collision-free by construction)
*.ue[*].cellularNic.slMac.resourceAllocationMode = "static"
*.ue[0].cellularNic.slMac.staticGrantSlotOffset = 0
*.ue[1].cellularNic.slMac.staticGrantSlotOffset = 1

# ----------------------------------------------------------------------------- #
# Config "Broadcast-Tr37885"
#
# Milestone M2 (WP-D): same as "Broadcast", but over the TR 37.885 highway V2V
# channel (pathloss + shadowing, SINR with interference from the SL
# transmission map, PSCCH threshold + PSSCH BLER decoding). The transmitter-
# receiver distance is an iteration variable for the PER-vs-distance sweep
# (see README).
#
[Config Broadcast-Tr37885]
extends = Broadcast

**.mobility.constraintAreaMaxX = 4000m

*.ue[*].cellularNic.slChannelModel.typename = "simu5g.stack.sidelink.phy.Tr37885ChannelModel"
*.ue[*].cellularNic.slChannelModel.scenario = "highway"

*.ue[1].mobility.initialX = 290m + ${dist=20}m

# ----------------------------------------------------------------------------- #
# Config "Broadcast-Tr37885-BlindRetx"
#
# WP-F: one blind HARQ retransmission per TB. The copy rides the next
# occasion of the same grant train (SL-1 simplification), so the app rate is
# halved to leave room for the copies. Compare received counts at the PER
# knee (e.g. --dist=600, grantMcs=12, shadowing off) against the same run
# with blindRetx: 0.
#
[Config Broadcast-Tr37885-BlindRetx]
extends = Broadcast-Tr37885

*.ue[0].app[*].period = 0.04s

*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    reservationPeriodsMs: [20], blindRetx: 1, \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# ----------------------------------------------------------------------------- #
# Config "Mode2-50UE"
#
# Milestone M3 (WP-E): 50 out-of-coverage UEs on one single-subchannel pool
# (200 slot-resources per 100ms period, 25% occupancy), all broadcasting
# periodic 300B alerts (CAM-style, 10 Hz) over the TR 37.885 highway channel.
# Resources are selected by the TS 38.321 5.22 sensing-based mode-2 procedure
# (the NED default). Compare against "Random-50UE": with SPS, random picks
# collide *persistently* until the reselection counter expires; sensing
# avoids the occupied resources.
#
[Config Mode2-50UE]
network = simu5g.simulations.nr.sidelink.basic.SidelinkBasic
sim-time-limit = 5s

*.numUes = 50
*.ue[*].hasSidelink = true
*.ue[*].mobility.initialX = uniform(100m, 400m)
*.ue[*].mobility.initialY = uniform(100m, 400m)

# with real link adaptation (SlMcsTable, D15) the MCS must be chosen so a
# whole 300B CAM fits one TB: MCS 16 -> TBS 349B on the 10-PRB subchannel
# (the SL-1 stub delivered 1000B at any MCS); keeps 1 TB per packet, i.e.
# the intended ~25% pool occupancy
*.ue[*].cellularNic.slMac.grantMcs = 16

*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 1, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [100], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

*.ue[*].cellularNic.slChannelModel.typename = "simu5g.stack.sidelink.phy.Tr37885ChannelModel"
*.ue[*].cellularNic.slChannelModel.scenario = "highway"

### CAM-style traffic: every UE sends and receives ###
*.ue[*].numApps = 2
*.ue[*].app[0].typename = "AlertSender"
*.ue[*].app[0].localPort = 3088
*.ue[*].app[0].startTime = uniform(0s, 0.1s)
*.ue[*].app[0].period = 0.1s
*.ue[*].app[0].packetSize = 300B
*.ue[*].app[0].destAddress = "224.0.0.10"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[1].typename = "AlertReceiver"
*.ue[*].app[1].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "Random-50UE"
#
# The community-standard baseline: identical scenario, but resources are
# picked uniformly at random from the selection window (no sensing).
#
[Config Random-50UE]
extends = Mode2-50UE
*.ue[*].cellularNic.slMac.resourceAllocationMode = "random"

# ----------------------------------------------------------------------------- #
# Config "Unicast-UM"
#
# Milestone M5 (WP-H): PC5 unicast between two out-of-coverage UEs with
# bidirectional CBR traffic. The first packet toward the peer triggers the
# genie PC5-RRC link establishment (D17): per-link SLRBs are allocated from
# unicastSlrbDefaults (here the built-in single UM bearer) and the full
# TX+RX chains come up at BOTH endpoints (symmetric establishment, D18).
# Classification is the D16 static rule: unicast destination address ->
# SL-capable peer -> PC5. Mode-2 resource selection over the TR 37.885
# channel; no broadcast SLRB is configured at all.
#
[Config Unicast-UM]
network = simu5g.simulations.nr.sidelink.basic.SidelinkBasic

*.numUes = 2
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 0
*.ue[*].hasSidelink = true

*.ue[0].mobility.initialX = 290m
*.ue[0].mobility.initialY = 350m
*.ue[1].mobility.initialX = 310m
*.ue[1].mobility.initialY = 350m

*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }

*.ue[*].cellularNic.slChannelModel.typename = "simu5g.stack.sidelink.phy.Tr37885ChannelModel"
*.ue[*].cellularNic.slChannelModel.scenario = "highway"

### bidirectional CBR traffic (40B every 20ms both ways) ###
*.ue[*].numApps = 2
*.ue[*].app[0].typename = "CbrSender"
*.ue[*].app[0].startTime = uniform(0s, 0.02s)
*.ue[*].app[0].finishTime = 1.9s
*.ue[0].app[0].destAddress = "ue[1]"
*.ue[1].app[0].destAddress = "ue[0]"
*.ue[*].app[1].typename = "CbrReceiver"
