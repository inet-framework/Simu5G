[General]
sim-time-limit = 2s
warmup-period = 0s
**.routingRecorder.enabled = false

output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2-Preconfig"
#
# WP-M spike (SL-3): the first configuration anywhere that combines a Uu
# attachment with the sidelink leg on the same UEs. 1 gNB + 4 NrUes, all
# with hasSidelink=true and nrServingNodeId=1, running concurrent Uu
# traffic (VoIP DL to ue[0], VoIP UL from ue[1]) and mode-2 sensing-based
# SL broadcast (ue[0] sends CAM-style alerts to the multicast group, all
# others receive over PC5). The two legs live on separate carriers:
# Uu on the 2 GHz component carrier, SL on the 5.9 GHz pool carrier.
# The SL pool still comes from the UE-local preconfig (poolSource
# provisioning is WP-N / milestone M9).
#
[Config InCoverage-Mode2-Preconfig]
network = simu5g.simulations.nr.networks.SingleCell_Standalone

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############## UE configuration ##################
*.numUe = 4

# all UEs are attached to the gNB (NR side only) AND run sidelink
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].hasSidelink = true

# UE positions: a tight cluster below the gNB (PC5 in ideal-channel range)
*.ue[0].mobility.initialX = 440m
*.ue[0].mobility.initialY = 350m
*.ue[1].mobility.initialX = 460m
*.ue[1].mobility.initialY = 350m
*.ue[2].mobility.initialX = 440m
*.ue[2].mobility.initialY = 370m
*.ue[3].mobility.initialX = 460m
*.ue[3].mobility.initialY = 370m

############### Sidelink configuration ##################
# mode-2 sensing-based selection (NED default) on a 5.9 GHz preconfig pool
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

############### Traffic configuration ##################
# Uu: VoIP DL server -> ue[0], VoIP UL ue[1] -> server
*.server.numApps = 2
*.server.app[0].typename = "VoipSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].startTime = uniform(0s, 0.02s)
*.server.app[1].typename = "VoipReceiver"
*.server.app[1].localPort = 3001

# SL: ue[0] broadcasts alerts over PC5; ue[1..3] receive them
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "VoipReceiver"
*.ue[0].app[0].localPort = 3000
*.ue[0].app[1].typename = "AlertSender"
*.ue[0].app[1].localPort = 3088
*.ue[0].app[1].startTime = uniform(0s, 0.02s)
*.ue[0].app[1].stopTime = 1.9s
*.ue[0].app[1].destAddress = "224.0.0.10"
*.ue[0].app[1].destPort = 1000

*.ue[1].numApps = 2
*.ue[1].app[0].typename = "VoipSender"
*.ue[1].app[0].localPort = 3010
*.ue[1].app[0].destAddress = "server"
*.ue[1].app[0].destPort = 3001
*.ue[1].app[0].startTime = uniform(0s, 0.02s)
*.ue[1].app[1].typename = "AlertReceiver"
*.ue[1].app[1].localPort = 1000

*.ue[2..3].numApps = 1
*.ue[2..3].app[0].typename = "AlertReceiver"
*.ue[2..3].app[0].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2"
#
# Milestone M9 (WP-N): the same scenario, but the SL pool is provisioned
# from the serving cell (D25 "genie SIB12"): the gNB carries the pool in
# slGnbRrc.slPoolConfig and the UEs use poolSource="servingCell". To prove
# the provisioning is effective, the UE-side preconfig's pool section is
# deliberately WRONG (2.4 GHz, 1 subchannel, 100 ms period): the run
# matches InCoverage-Mode2-Preconfig (alert delay ~7 ms on the 20 ms
# 5-subchannel pool) only because the cell pool overrides it. Only the
# SLRB section of the UE preconfig is used.
#
[Config InCoverage-Mode2]
extends = InCoverage-Mode2-Preconfig

*.gnb.hasSidelink = true
*.gnb.cellularNic.slGnbRrc.slPoolConfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }

*.ue[*].cellularNic.slRrc.poolSource = "servingCell"
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 2.4GHz, numerologyIndex: 0, \
    subchannelSize: 4, numSubchannels: 1, \
    reservationPeriodsMs: [100], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2-Mixed"
#
# WP-N mixed-coverage interop: ue[3] is out of coverage (detached) and
# falls back to its local preconfig - which carries the TRUE pool - while
# the attached ue[0..2] are provisioned from the cell. All four UEs end up
# on the same pool and interoperate: ue[3] receives the broadcast alerts
# like the attached receivers.
#
[Config InCoverage-Mode2-Mixed]
extends = InCoverage-Mode2

*.ue[3].nrServingNodeId = 0
*.ue[3].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# ----------------------------------------------------------------------------- #
# Config "Mode1-Dynamic"
#
# Milestone M10 (WP-O): gNB-scheduled sidelink ("mode 1") with dynamic
# grants. Two of four attached UEs broadcast sporadic alerts (exponential
# inter-arrival) over PC5; every TB is requested from the gNB through the
# full ladder:
#   SL backlog -> preamble RAC -> BSR-grant (Uu UL) -> SL-BSR
#   (packetLcid SL_SHORT_BSR) -> SlEnbScheduler allocation -> DCI
#   3_0-equivalent (SlSchedulingGrant over the Uu DL) -> finite occasion
#   train on the SL pool -> PC5 delivery.
# The per-cycle latency is recorded as slMode1GrantLatency. Collision-free
# by construction (the gNB's allocation grid); the price is the request
# cycle's latency - compare "Mode2-Sporadic".
#
[Config Mode1-Dynamic]
extends = InCoverage-Mode2-Preconfig
sim-time-limit = 5s

*.gnb.hasSidelink = true
*.gnb.cellularNic.slGnbRrc.slPoolConfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }

*.ue[*].cellularNic.slRrc.poolSource = "servingCell"
*.ue[*].cellularNic.slMac.resourceAllocationMode = "mode1"
**.slMac.slMode1GrantLatency.result-recording-modes = all

### sporadic alert traffic on two senders; everyone else receives ###
*.ue[0].numApps = 1
*.ue[0].app[0].typename = "AlertSender"
*.ue[0].app[0].localPort = 3088
*.ue[0].app[0].startTime = uniform(0s, 0.05s)
*.ue[0].app[0].stopTime = 4.9s
*.ue[0].app[0].period = exponential(0.1s)
*.ue[0].app[0].destAddress = "224.0.0.10"
*.ue[0].app[0].destPort = 1000

*.ue[1].numApps = 2
*.ue[1].app[0].typename = "AlertSender"
*.ue[1].app[0].localPort = 3089
*.ue[1].app[0].startTime = uniform(0s, 0.05s)
*.ue[1].app[0].stopTime = 4.9s
*.ue[1].app[0].period = exponential(0.1s)
*.ue[1].app[0].destAddress = "224.0.0.10"
*.ue[1].app[0].destPort = 1000
*.ue[1].app[1].typename = "AlertReceiver"
*.ue[1].app[1].localPort = 1000

*.ue[2..3].numApps = 1
*.ue[2..3].app[0].typename = "AlertReceiver"
*.ue[2..3].app[0].localPort = 1000

# no Uu apps in this config (the Uu carries the mode-1 signaling)
*.server.numApps = 0

# ----------------------------------------------------------------------------- #
# Config "Mode2-Sporadic"
#
# The mode-2 baseline for "Mode1-Dynamic": identical offered load, but
# resources are self-selected by sensing (no gNB, no request cycle).
# Lower latency (no RAC/BSR/DCI ladder), but selections can collide -
# the numbers are compared in the README.
#
[Config Mode2-Sporadic]
extends = Mode1-Dynamic

*.ue[*].cellularNic.slMac.resourceAllocationMode = "mode2"

# ----------------------------------------------------------------------------- #
# Config "Mode1-CG1"
#
# Milestone M11 (WP-P): a type-1 configured grant. ue[0] sends CAM-style
# 300 B alerts at 10 Hz over a standing 100 ms CG train reserved at the
# gNB (slRrc.configuredGrant) - zero grant-cycle signaling after init
# (no RAC/BSR/DCI per packet; compare Mode1-Dynamic on the same traffic),
# packet delay = the phase wait for the next CG occasion.
#
[Config Mode1-CG1]
extends = InCoverage-Mode2-Preconfig
sim-time-limit = 5s

*.gnb.hasSidelink = true
*.gnb.cellularNic.slGnbRrc.slPoolConfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }
*.gnb.cellularNic.slGnbRrc.grantMcs = 16

*.ue[*].cellularNic.slRrc.poolSource = "servingCell"
*.ue[*].cellularNic.slMac.resourceAllocationMode = "mode1"
**.slMac.slMode1GrantLatency.result-recording-modes = all

# ue[0]'s standing train: 100 ms period, one 300B CAM (+headers) per TB
*.ue[0].cellularNic.slRrc.configuredGrant = { type: 1, periodMs: 100, tbBytes: 330 }

### CAM traffic: ue[0] sends 10 Hz, everyone else receives ###
*.ue[0].numApps = 1
*.ue[0].app[0].typename = "AlertSender"
*.ue[0].app[0].localPort = 3088
*.ue[0].app[0].startTime = 0.05s
*.ue[0].app[0].stopTime = 4.9s
*.ue[0].app[0].period = 0.1s
*.ue[0].app[0].packetSize = 300B
*.ue[0].app[0].destAddress = "224.0.0.10"
*.ue[0].app[0].destPort = 1000

*.ue[1..3].numApps = 1
*.ue[1..3].app[0].typename = "AlertReceiver"
*.ue[1..3].app[0].localPort = 1000

*.server.numApps = 0

# ----------------------------------------------------------------------------- #
# Config "Mode1-CG1-DynamicBaseline"
#
# The same CAM traffic served by dynamic grants (no CG): every packet pays
# the RAC/BSR/DCI ladder. The latency + Uu signaling overhead comparison
# against Mode1-CG1 is in the README.
#
[Config Mode1-CG1-DynamicBaseline]
extends = Mode1-CG1

*.ue[0].cellularNic.slRrc.configuredGrant = {}

# ----------------------------------------------------------------------------- #
# Config "Mode1-CG2"
#
# Milestone M11 (WP-P): a type-2 configured grant with on/off traffic.
# The CG train is reserved at the gNB but dormant; the first burst's
# backlog runs one RAC/SL-BSR cycle and gets a cgAction=activate DCI
# instead of a dynamic grant; after the burst the UE self-releases the CG
# (5 empty occasions = 500 ms); the second burst re-activates it. The
# activate -> use -> release -> re-activate sequence is visible in the
# EV log.
#
[Config Mode1-CG2]
extends = Mode1-CG1

*.ue[0].cellularNic.slRrc.configuredGrant = { type: 2, periodMs: 100, tbBytes: 700 }

# on/off traffic: two bursts with a 1.6 s silence between them
*.ue[0].numApps = 2
*.ue[0].app[0].stopTime = 1.4s
*.ue[0].app[1].typename = "AlertSender"
*.ue[0].app[1].localPort = 3089
*.ue[0].app[1].startTime = 3.0s
*.ue[0].app[1].stopTime = 4.4s
*.ue[0].app[1].period = 0.1s
*.ue[0].app[1].packetSize = 300B
*.ue[0].app[1].destAddress = "224.0.0.10"
*.ue[0].app[1].destPort = 1000

# ----------------------------------------------------------------------------- #
# Config "SharedRadio"
#
# Milestone M12 (WP-Q, D32): the Uu/SL half-duplex arbiter. ue[0] runs
# concurrent Uu UL VoIP (to the server) and its CG CAM train; every UE
# also sends periodic CQI feedback on the Uu. With sharedUuSlRadio=true
# on both PHY legs, a single radio is modeled: SL slots overlapped by a
# Uu transmission are lost (slHalfDuplexUuDrops, and the slot counts as
# unmonitored for sensing), Uu data frames overlapping an SL TX are lost
# (uuHalfDuplexSlDrops), and simultaneous SL+Uu transmissions are counted
# (slUuTxConflicts) but not suppressed. Compare "SharedRadio-Off"
# (identical traffic, arbiter off = the independent-legs behavior).
#
[Config SharedRadio]
extends = Mode1-CG1

# whole-packet TBs (see the Mode1-CG2 note): keeps the loss attribution
# clean - every lost TB is exactly one lost CAM
*.ue[0].cellularNic.slRrc.configuredGrant = { type: 1, periodMs: 100, tbBytes: 700 }

*.ue[*].cellularNic.nrPhy.sharedUuSlRadio = true
*.ue[*].cellularNic.slPhy.sharedUuSlRadio = true
**.slHalfDuplexUuDrops.result-recording-modes = all
**.uuHalfDuplexSlDrops.result-recording-modes = all
**.slUuTxConflicts.result-recording-modes = all

### concurrent Uu VoIP UL and DL at the CG sender ###
*.server.numApps = 2
*.server.app[0].typename = "VoipReceiver"
*.server.app[0].localPort = 3001
*.server.app[1].typename = "VoipSender"
*.server.app[1].localPort = 3088
*.server.app[1].destAddress = "ue[0]"
*.server.app[1].destPort = 3000
*.server.app[1].startTime = uniform(0s, 0.02s)

*.ue[0].numApps = 3
*.ue[0].app[1].typename = "VoipSender"
*.ue[0].app[1].localPort = 3010
*.ue[0].app[1].destAddress = "server"
*.ue[0].app[1].destPort = 3001
*.ue[0].app[1].startTime = uniform(0s, 0.02s)
*.ue[0].app[2].typename = "VoipReceiver"
*.ue[0].app[2].localPort = 3000

# ----------------------------------------------------------------------------- #
# Config "SharedRadio-Off"
#
# The control: identical traffic, independent legs (pre-SL-3 behavior).
#
[Config SharedRadio-Off]
extends = SharedRadio

*.ue[*].cellularNic.nrPhy.sharedUuSlRadio = false
*.ue[*].cellularNic.slPhy.sharedUuSlRadio = false

# ----------------------------------------------------------------------------- #
# Config "Mode1Mode2-SharedPool"
#
# D34: one deliberate shared-pool config demonstrating the one-way
# mode-1/mode-2 sensing coupling (G26). ue[0] runs a mode-1 CG1 CAM train;
# ue[1..3] are mode-2 CAM senders on the SAME cell pool, over the TR 37.885
# channel (real SINR, so collisions actually destroy frames). Mode-2 UEs
# decode the train's SCIs (reservation stamped with the CG period) and
# avoid it; the gNB stays blind to mode-2 reservations. Compare
# "Mode1Mode2-SharedPool-Random": without sensing the mode-2 UEs collide
# with the train persistently. Numbers in the README.
#
[Config Mode1Mode2-SharedPool]
extends = Mode1-CG1

# a deliberately tight single-subchannel pool: every selection contends
# with the CG train, so the (non-)avoidance is measurable
*.gnb.cellularNic.slGnbRrc.slPoolConfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 1, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }

*.ue[*].cellularNic.slChannelModel.typename = "simu5g.stack.sidelink.phy.Tr37885ChannelModel"
*.ue[*].cellularNic.slChannelModel.scenario = "highway"

*.ue[1..3].cellularNic.slMac.resourceAllocationMode = "mode2"
*.ue[1..3].cellularNic.slMac.grantMcs = 16

# the CG train's alerts go to their own port so its PRR is measured
# separately from the mode-2 traffic
*.ue[0].app[0].destPort = 1001

*.ue[1..3].numApps = 3
*.ue[1..3].app[0].typename = "AlertSender"
*.ue[1..3].app[0].localPort = 3088
*.ue[1..3].app[0].startTime = uniform(0s, 0.02s)
*.ue[1..3].app[0].stopTime = 4.9s
*.ue[1..3].app[0].period = 0.02s
*.ue[1..3].app[0].packetSize = 300B
*.ue[1..3].app[0].destAddress = "224.0.0.10"
*.ue[1..3].app[0].destPort = 1000
*.ue[1..3].app[1].typename = "AlertReceiver"
*.ue[1..3].app[1].localPort = 1000
*.ue[1..3].app[2].typename = "AlertReceiver"
*.ue[1..3].app[2].localPort = 1001

# ue[0] also listens to the mode-2 traffic
*.ue[0].numApps = 2
*.ue[0].app[1].typename = "AlertReceiver"
*.ue[0].app[1].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "Mode1Mode2-SharedPool-Random"
#
# The G26 control: identical, but the mode-2 UEs pick resources at random
# (no sensing) - they cannot see the CG train's SCIs and collide with it.
#
[Config Mode1Mode2-SharedPool-Random]
extends = Mode1Mode2-SharedPool

*.ue[1..3].cellularNic.slMac.resourceAllocationMode = "random"

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Handover"
#
# WP-M step 2(b), G25 audit: 2 gNBs, one SL-active UE crossing the cell
# border under linear mobility (forced handover around mid-run), a second
# (stationary) SL UE staying near gnb1. Both keep exchanging mode-2 SL
# broadcast traffic before/during/after the handover, and the moving UE
# also receives Uu VoIP DL across the handover. Verifies that
# HandoverController::deleteOldBuffers does not tear down SL bearers
# (SL entities are keyed by SL L2 pids, Uu teardown by the Uu peer id)
# and that held-Uu-packet flush does not touch PC5 packets.
#
[Config InCoverage-Handover]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
sim-time-limit = 5s
**.rrc.**.vector-recording = true

**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

############### gNodeB configuration #################
*.gnb1.mobility.initialX = 300m
*.gnb1.mobility.initialY = 300m
*.gnb2.mobility.initialX = 700m
*.gnb2.mobility.initialY = 300m

############### X2 configuration #################
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

############## UE configuration ##################
*.numUe = 2
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].hasSidelink = true
**.dynamicCellAssociation = true
**.enableHandover = true

# ue[0] moves from gnb1's cell into gnb2's cell (handover ~mid-run)
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.initialX = 350m
*.ue[0].mobility.initialY = 350m
*.ue[0].mobility.initialMovementHeading = 0deg
*.ue[0].mobility.speed = 60mps
# ue[1] trails the moving UE so PC5 stays in range throughout
*.ue[1].mobility.typename = "LinearMobility"
*.ue[1].mobility.initialX = 340m
*.ue[1].mobility.initialY = 360m
*.ue[1].mobility.initialMovementHeading = 0deg
*.ue[1].mobility.speed = 60mps

############### Sidelink configuration ##################
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

############### Traffic configuration ##################
# Uu: VoIP DL to the moving UE, across the handover
*.server.numApps = 1
*.server.app[0].typename = "VoipSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].startTime = 0.05s

# SL: the moving UE broadcasts alerts; the trailing UE receives them
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "VoipReceiver"
*.ue[0].app[0].localPort = 3000
*.ue[0].app[1].typename = "AlertSender"
*.ue[0].app[1].localPort = 3089
*.ue[0].app[1].startTime = 0.05s
*.ue[0].app[1].stopTime = 4.9s
*.ue[0].app[1].destAddress = "224.0.0.10"
*.ue[0].app[1].destPort = 1000

*.ue[1].numApps = 1
*.ue[1].app[0].typename = "AlertReceiver"
*.ue[1].app[0].localPort = 1000
