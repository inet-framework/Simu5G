[General]
sim-time-limit = 2s
warmup-period = 0s
**.routingRecorder.enabled = false

output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2-Preconfig"
#
# WP-M spike (SL-3): the first configuration anywhere that combines a Uu
# attachment with the sidelink leg on the same UEs. 1 gNB + 4 NrUes, all
# with hasSidelink=true and nrServingNodeId=1, running concurrent Uu
# traffic (VoIP DL to ue[0], VoIP UL from ue[1]) and mode-2 sensing-based
# SL broadcast (ue[0] sends CAM-style alerts to the multicast group, all
# others receive over PC5). The two legs live on separate carriers:
# Uu on the 2 GHz component carrier, SL on the 5.9 GHz pool carrier.
# The SL pool still comes from the UE-local preconfig (poolSource
# provisioning is WP-N / milestone M9).
#
[Config InCoverage-Mode2-Preconfig]
network = simu5g.simulations.nr.networks.SingleCell_Standalone

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############## UE configuration ##################
*.numUe = 4

# all UEs are attached to the gNB (NR side only) AND run sidelink
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].hasSidelink = true

# UE positions: a tight cluster below the gNB (PC5 in ideal-channel range)
*.ue[0].mobility.initialX = 440m
*.ue[0].mobility.initialY = 350m
*.ue[1].mobility.initialX = 460m
*.ue[1].mobility.initialY = 350m
*.ue[2].mobility.initialX = 440m
*.ue[2].mobility.initialY = 370m
*.ue[3].mobility.initialX = 460m
*.ue[3].mobility.initialY = 370m

############### Sidelink configuration ##################
# mode-2 sensing-based selection (NED default) on a 5.9 GHz preconfig pool
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

############### Traffic configuration ##################
# Uu: VoIP DL server -> ue[0], VoIP UL ue[1] -> server
*.server.numApps = 2
*.server.app[0].typename = "VoipSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].startTime = uniform(0s, 0.02s)
*.server.app[1].typename = "VoipReceiver"
*.server.app[1].localPort = 3001

# SL: ue[0] broadcasts alerts over PC5; ue[1..3] receive them
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "VoipReceiver"
*.ue[0].app[0].localPort = 3000
*.ue[0].app[1].typename = "AlertSender"
*.ue[0].app[1].localPort = 3088
*.ue[0].app[1].startTime = uniform(0s, 0.02s)
*.ue[0].app[1].stopTime = 1.9s
*.ue[0].app[1].destAddress = "224.0.0.10"
*.ue[0].app[1].destPort = 1000

*.ue[1].numApps = 2
*.ue[1].app[0].typename = "VoipSender"
*.ue[1].app[0].localPort = 3010
*.ue[1].app[0].destAddress = "server"
*.ue[1].app[0].destPort = 3001
*.ue[1].app[0].startTime = uniform(0s, 0.02s)
*.ue[1].app[1].typename = "AlertReceiver"
*.ue[1].app[1].localPort = 1000

*.ue[2..3].numApps = 1
*.ue[2..3].app[0].typename = "AlertReceiver"
*.ue[2..3].app[0].localPort = 1000

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2"
#
# Milestone M9 (WP-N): the same scenario, but the SL pool is provisioned
# from the serving cell (D25 "genie SIB12"): the gNB carries the pool in
# slGnbRrc.slPoolConfig and the UEs use poolSource="servingCell". To prove
# the provisioning is effective, the UE-side preconfig's pool section is
# deliberately WRONG (2.4 GHz, 1 subchannel, 100 ms period): the run
# matches InCoverage-Mode2-Preconfig (alert delay ~7 ms on the 20 ms
# 5-subchannel pool) only because the cell pool overrides it. Only the
# SLRB section of the UE preconfig is used.
#
[Config InCoverage-Mode2]
extends = InCoverage-Mode2-Preconfig

*.gnb.hasSidelink = true
*.gnb.cellularNic.slGnbRrc.slPoolConfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20] }

*.ue[*].cellularNic.slRrc.poolSource = "servingCell"
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 2.4GHz, numerologyIndex: 0, \
    subchannelSize: 4, numSubchannels: 1, \
    reservationPeriodsMs: [100], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Mode2-Mixed"
#
# WP-N mixed-coverage interop: ue[3] is out of coverage (detached) and
# falls back to its local preconfig - which carries the TRUE pool - while
# the attached ue[0..2] are provisioned from the cell. All four UEs end up
# on the same pool and interoperate: ue[3] receives the broadcast alerts
# like the attached receivers.
#
[Config InCoverage-Mode2-Mixed]
extends = InCoverage-Mode2

*.ue[3].nrServingNodeId = 0
*.ue[3].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

# ----------------------------------------------------------------------------- #
# Config "InCoverage-Handover"
#
# WP-M step 2(b), G25 audit: 2 gNBs, one SL-active UE crossing the cell
# border under linear mobility (forced handover around mid-run), a second
# (stationary) SL UE staying near gnb1. Both keep exchanging mode-2 SL
# broadcast traffic before/during/after the handover, and the moving UE
# also receives Uu VoIP DL across the handover. Verifies that
# HandoverController::deleteOldBuffers does not tear down SL bearers
# (SL entities are keyed by SL L2 pids, Uu teardown by the Uu peer id)
# and that held-Uu-packet flush does not touch PC5 packets.
#
[Config InCoverage-Handover]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
sim-time-limit = 5s
**.rrc.**.vector-recording = true

**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

############### gNodeB configuration #################
*.gnb1.mobility.initialX = 300m
*.gnb1.mobility.initialY = 300m
*.gnb2.mobility.initialX = 700m
*.gnb2.mobility.initialY = 300m

############### X2 configuration #################
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

############## UE configuration ##################
*.numUe = 2
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].hasSidelink = true
**.dynamicCellAssociation = true
**.enableHandover = true

# ue[0] moves from gnb1's cell into gnb2's cell (handover ~mid-run)
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.initialX = 350m
*.ue[0].mobility.initialY = 350m
*.ue[0].mobility.initialMovementHeading = 0deg
*.ue[0].mobility.speed = 60mps
# ue[1] trails the moving UE so PC5 stays in range throughout
*.ue[1].mobility.typename = "LinearMobility"
*.ue[1].mobility.initialX = 340m
*.ue[1].mobility.initialY = 360m
*.ue[1].mobility.initialMovementHeading = 0deg
*.ue[1].mobility.speed = 60mps

############### Sidelink configuration ##################
*.ue[*].cellularNic.slRrc.preconfig = { \
    carrierFrequency: 5.9GHz, numerologyIndex: 1, \
    subchannelSize: 10, numSubchannels: 5, \
    t1: 2, t2: 20, rsrpThresholdDbm: -128, \
    reservationPeriodsMs: [20], \
    slrbConfig: [ { dstL2Id: 0xFFFFFF, castType: "broadcast", drb: 1, \
                    rlcType: "UM", destAddress: "224.0.0.10" } ] }

############### Traffic configuration ##################
# Uu: VoIP DL to the moving UE, across the handover
*.server.numApps = 1
*.server.app[0].typename = "VoipSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].startTime = 0.05s

# SL: the moving UE broadcasts alerts; the trailing UE receives them
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "VoipReceiver"
*.ue[0].app[0].localPort = 3000
*.ue[0].app[1].typename = "AlertSender"
*.ue[0].app[1].localPort = 3089
*.ue[0].app[1].startTime = 0.05s
*.ue[0].app[1].stopTime = 4.9s
*.ue[0].app[1].destAddress = "224.0.0.10"
*.ue[0].app[1].destPort = 1000

*.ue[1].numApps = 1
*.ue[1].app[0].typename = "AlertReceiver"
*.ue[1].app[0].localPort = 1000
